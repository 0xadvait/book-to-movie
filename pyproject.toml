[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-to-movie"
version = "0.1.0"
description = "Turn any book into an illustrated, narrated film with Claude Code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  # bounded to the major versions this was tested on, so a clone next year still works
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "opencv-python-headless>=4.8,<5",   # OpenCV 5 removed the face detector portraits use
  "pillow>=10,<14",
  "lxml>=5,<7",
  "soundfile>=0.12,<1",
  "pyloudnorm>=0.1.1,<1",
  "mlx-whisper>=0.4,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "faster-whisper>=1.1,<2; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
movie = "book_to_movie.cli:main"

[tool.setuptools]
packages = ["book_to_movie"]

[tool.setuptools.package-data]
book_to_movie = ["assets/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
