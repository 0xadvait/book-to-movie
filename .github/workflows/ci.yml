name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg librsvg2-bin poppler-utils espeak-ng
      - name: Set up
        run: ./setup.sh
      - name: Tests
        run: .venv/bin/pytest -q
      - name: Make the demo film, end to end, with real speech
        run: ./movie demo --voice espeak
      - name: Keep a contact sheet to look at
        run: ./movie -p the-shepherds-boy contact 1 -o contact.png
      - uses: actions/upload-artifact@v4
        with:
          name: contact-sheet
          path: contact.png

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
